<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2443" viewBox="0 0 1280 2443"><style>text{font-family:Arial,sans-serif;fill:#15324d} .title{font-size:28px;font-weight:bold} .label{font-size:18px} .edge{font-size:15px;fill:#465c70}</style><rect width="100%" height="100%" fill="#f6f9fc"/><text x="32" y="45" class="title">AITU · use-cases · целевая система</text><text x="32" y="76" class="edge">Редактируемый исходник: diagrams/source/use-cases.puml · связи направлены слева направо</text><rect x="32" y="105" width="540" height="72" rx="10" fill="#e4eef8" stroke="#a9bfd3"/><text x="48" y="132" class="label">Преподаватель</text><text x="590" y="127" class="edge"> → Просмотреть навыки и события; Подать карточку / запрос; Оценить</text><text x="590" y="147" class="edge">результат / запросить замену</text><rect x="32" y="193" width="540" height="72" rx="10" fill="#e4eef8" stroke="#a9bfd3"/><text x="48" y="220" class="label">Наставник</text><text x="590" y="215" class="edge"> → Согласовать пару; Разработать и согласовать план; Записать</text><text x="590" y="235" class="edge">встречу и Development Visit; Подтвердить встречу второго участника</text><rect x="32" y="281" width="540" height="72" rx="10" fill="#e4eef8" stroke="#a9bfd3"/><text x="48" y="308" class="label">Наставляемый</text><text x="590" y="303" class="edge"> → Согласовать пару; Разработать и согласовать план; Записать</text><text x="590" y="323" class="edge">встречу и Development Visit; Подтвердить встречу второго участника</text><rect x="32" y="369" width="540" height="72" rx="10" fill="#e4eef8" stroke="#a9bfd3"/><text x="48" y="396" class="label">Школа и директор</text><text x="590" y="391" class="edge"> → Подобрать и представить пару; Утвердить план; Получить обобщенный</text><text x="590" y="411" class="edge">отчет; Вернуть план с причиной; Сформировать итоги / архив</text><rect x="32" y="457" width="540" height="72" rx="10" fill="#e4eef8" stroke="#a9bfd3"/><text x="48" y="484" class="label">Проре